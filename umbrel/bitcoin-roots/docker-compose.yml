version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: ${APP_BITCOIN_ROOTS_NODE_IP}
      APP_PORT: 3000
  app:
    # Replace with the published multi-architecture digest before store submission.
    image: ghcr.io/tiero/umbrel-bitcoin-roots:v1.4.0-roots.1
    user: '1000:1000'
    restart: on-failure
    stop_grace_period: 15m30s
    ports:
      - '8333:8333'
      - '8332:8332'
    depends_on:
      tor:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APPS_SUBNET: ${NETWORK_IP}/16
      BITCOIND_IP: ${APP_BITCOIN_ROOTS_NODE_IP}
      RPC_USER: ${APP_BITCOIN_ROOTS_RPC_USER}
      RPC_PASS: ${APP_BITCOIN_ROOTS_RPC_PASS}
      P2P_PORT: 8333
      RPC_PORT: 8332
      TOR_PORT: 8334
      TOR_HOST: ${APP_BITCOIN_ROOTS_TOR_IP}
      TOR_SOCKS_PORT: 9050
      TOR_CONTROL_PORT: 9051
      TOR_CONTROL_PASSWORD: ${APP_BITCOIN_ROOTS_TOR_PASSWORD}
      I2P_HOST: ${APP_BITCOIN_ROOTS_I2P_IP}
      I2P_SAM_PORT: 7656
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
      P2P_HIDDEN_SERVICE_FILE: /data/tor/p2p/hostname
      RPC_HIDDEN_SERVICE_FILE: /data/tor/rpc/hostname
    networks:
      default:
        ipv4_address: ${APP_BITCOIN_ROOTS_NODE_IP}
  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: '1000:1000'
    restart: on-failure
    entrypoint: ['bash', '/scripts/tor-entrypoint.sh']
    environment:
      TOR_CONTROL_PASSWORD: ${APP_BITCOIN_ROOTS_TOR_PASSWORD}
      BITCOIND_IP: ${APP_BITCOIN_ROOTS_NODE_IP}
    volumes:
      - ${APP_DATA_DIR}/hooks/tor-entrypoint.sh:/scripts/tor-entrypoint.sh:ro
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/9051"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        ipv4_address: ${APP_BITCOIN_ROOTS_TOR_IP}
  i2p:
    image: purplei2p/i2pd:release-2.59.0@sha256:257653c18ce0b127ef480e3d8373b3ddbf1495e842674c8cfc59909be0015979
    restart: on-failure
    command: --sam.enabled=true --sam.address=0.0.0.0 --sam.port=7656 --loglevel=error
    volumes:
      - ${APP_DATA_DIR}/data/i2pd:/home/i2pd/data
    networks:
      default:
        ipv4_address: ${APP_BITCOIN_ROOTS_I2P_IP}
