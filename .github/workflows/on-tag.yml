name: Docker Build and Push
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and push (e.g. 1.0.0)'
        required: true
        type: string

# Each architecture is built on a native GitHub-hosted runner (no QEMU
# emulation), then a manifest job assembles the multi-arch index. This keeps
# builds in the 5-10 minute range; the emulated single-job variant hung.

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set VERSION and TAG
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Setup Docker buildx
        run: docker buildx create --use

      - name: Run Docker buildx
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --file apps/backend/Dockerfile \
            --build-arg "VERSION=${VERSION}" \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:${TAG}-${{ matrix.slug }}" \
            --push .

  manifest:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set TAG
        run: echo "TAG=${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Setup Docker buildx
        run: docker buildx create --use

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
